<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b2f52">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Statistiky, docházka a rozpis hokejového týmu HC Alcedo (AHL Valašské Meziříčí).">
  <meta property="og:type" content="website">
  <meta property="og:title" content="HC Alcedo – statistiky a docházka">
  <meta property="og:description" content="Další zápas, tabulka, docházka a profily hráčů HC Alcedo.">
  <meta property="og:image" content="https://hc-alcedo.web.app/img/logo.webp">
  <meta property="og:url" content="https://hc-alcedo.web.app/">  <title>HC Alcedo – statistiky a docházka</title>
  <link rel="icon" href="img/logo.webp" type="image/webp">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-head">
    <div class="head-inner">
      <img class="logo" src="img/logo.webp" alt="HC Alcedo – logo" width="76" height="76">
      <div class="brand">
        <h1>HC <span>Alcedo</span></h1>
        <p>AHL Valašské Meziříčí · Divize 3B · statistiky a docházka</p>
      </div>
      <div class="head-right">
        <label for="season">Ročník</label>
        <select id="season" aria-label="Ročník"></select>
      </div>
    </div>
  </header>

  <nav class="tabs" aria-label="Sekce">
    <div class="tabs-inner" role="tablist">
      <button class="tab" role="tab" data-tab="prehled" aria-selected="true">Přehled</button>
      <button class="tab" role="tab" data-tab="zapasy" aria-selected="false">Zápasy</button>
      <button class="tab" role="tab" data-tab="dochazka" aria-selected="false">Docházka</button>
      <button class="tab" role="tab" data-tab="soupiska" aria-selected="false">Soupiska</button>
      <button class="tab" role="tab" data-tab="tabulka" aria-selected="false">Tabulka a soupeři</button>
    </div>
  </nav>

  <main id="app">
    <div class="loading">Načítám data…</div>
  </main>

  <div class="rink-line"></div>
  <footer id="foot"></footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
